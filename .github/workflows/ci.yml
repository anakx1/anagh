name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11.17.0 index.html lab.html 404.html resume.html homelab.html
      - name: Check JavaScript syntax
        run: node --check assets/site.js && node --check assets/resume.js
      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/check_links.py
      - name: Validate metadata
        run: |
          python3 -m json.tool site.webmanifest >/dev/null
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Check local links and anchors
        run: python3 scripts/check_links.py index.html lab.html 404.html resume.html homelab.html
