name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11.17.0 index.html lab.html 404.html resume.html homelab.html writing.html
      - name: Check JavaScript syntax
        run: node --check assets/site.js && node --check assets/resume.js && node --check assets/theme.js
      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/check_links.py scripts/check_csp.py scripts/make_maskable_icon.py
      - name: Validate metadata
        run: |
          python3 -m json.tool site.webmanifest >/dev/null
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Check local links and anchors
        run: python3 scripts/check_links.py index.html lab.html 404.html resume.html homelab.html writing.html
      - name: Check CSP and referrer policy
        run: python3 scripts/check_csp.py index.html lab.html 404.html resume.html homelab.html writing.html
      - name: Check self-hosted font assets
        run: |
          test -s assets/fonts/inter-latin-var.woff2
          test -s assets/fonts/jetbrains-mono-latin-var.woff2
          grep -q 'font-display: swap' assets/fonts.css
      - name: Check app icon assets
        run: |
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/icon-maskable-512.png
